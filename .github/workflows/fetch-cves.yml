name: Refresh CVE intelligence

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-cves
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch OpenCVE snapshot
        env:
          OPENCVE_API_TOKEN: ${{ secrets.OPENCVE_API_TOKEN }}
        run: python scripts/fetch_opencve.py

      - name: Commit updated CVE data
        run: |
          git config user.name "cve-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/cves.json
          if git diff --cached --quiet; then
            echo "No CVE changes -- nothing to commit."
          else
            git commit -m "chore: refresh CVE intelligence"
            git push
          fi
